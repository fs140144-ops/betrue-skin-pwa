name: Deploy to GitHub Pages

# legacy(Jekyll)ビルドが原因不明のまま "Page build failed" になる問題を回避するため、
# GitHub Actions経由のPagesデプロイに切り替えた。こちらは詳細なビルドログが
# Actionsのrun画面で確認できる（レガシー方式はエラーメッセージがほぼ空だった）。
# このPWAは静的ファイルのみ（ビルドステップ不要）なので、リポジトリの中身を
# そのままアーティファクトとしてアップロード・公開するだけでよい。
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
